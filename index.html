<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ball Race Simulator — Viral Shorts Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Left / Center: 9:16 Vertical Stage -->
    <main class="stage-column">
      <div class="canvas-frame">
        <canvas id="raceCanvas" width="1080" height="1920"></canvas>
        <div id="recBadge" class="rec-badge hidden" aria-live="polite">
          <span class="rec-dot"></span>
          <span>REC</span>
          <span id="recTimer">00:00</span>
        </div>
      </div>
    </main>

    <!-- Right / Bottom: Controls Panel -->
    <aside class="controls-panel" aria-label="Simulation Controls">
      <header class="panel-header">
        <div class="brand-row">
          <span class="brand-pill">9:16 SHORTS STUDIO</span>
          <button id="muteBtn" class="icon-btn" type="button" title="Toggle Sound" aria-pressed="false">
            <span id="muteIcon">🔊</span>
            <span id="muteLabel">Sound On</span>
          </button>
        </div>
        <h1>Ball Race Simulator</h1>
        <p class="subtitle">Configure parameters, preview at 60fps, and export a clean 1080×1920 vertical video.</p>
      </header>

      <!-- Playback & Export Actions -->
      <section class="control-group actions-group">
        <div class="btn-row primary-actions">
          <button id="playBtn" class="btn btn-primary" type="button">▶ Play</button>
          <button id="pauseBtn" class="btn btn-secondary" type="button" disabled>⏸ Pause</button>
          <button id="restartBtn" class="btn btn-secondary" type="button">↺ Restart</button>
        </div>

        <div class="btn-row export-actions">
          <button id="recordBtn" class="btn btn-record" type="button">● Record 60fps</button>
          <button id="thumbBtn" class="btn btn-outline" type="button">⬇ Thumbnail PNG</button>
        </div>
      </section>

      <!-- Playback Speed -->
      <section class="control-group">
        <div class="label-row">
          <label>Playback Speed</label>
          <span id="speedValue" class="value-chip">1x</span>
        </div>
        <div class="segmented" id="speedGroup" role="group" aria-label="Playback Speed">
          <button type="button" class="seg-btn" data-speed="0.5">0.5x</button>
          <button type="button" class="seg-btn active" data-speed="1">1x</button>
          <button type="button" class="seg-btn" data-speed="1.5">1.5x</button>
          <button type="button" class="seg-btn" data-speed="2">2x</button>
        </div>
      </section>

      <!-- Race Configuration -->
      <section class="control-group grid-two">
        <div class="field">
          <label for="leftCountInput">Left Ball Count</label>
          <input id="leftCountInput" type="number" min="1" step="1" value="1000000" />
        </div>
        <div class="field">
          <label for="rightStartInput">Right Start Count</label>
          <input id="rightStartInput" type="number" min="1" step="1" value="1" />
        </div>
      </section>

      <section class="control-group">
        <div class="label-row">
          <label>Right Multiplier Per Floor</label>
          <span id="multValue" class="value-chip">x2</span>
        </div>
        <div class="segmented" id="multGroup" role="group" aria-label="Multiplier Per Floor">
          <button type="button" class="seg-btn active" data-mult="2">x2</button>
          <button type="button" class="seg-btn" data-mult="3">x3</button>
          <button type="button" class="seg-btn" data-mult="5">x5</button>
        </div>
      </section>

      <section class="control-group">
        <div class="label-row">
          <label for="floorsRange">Number of Floors</label>
          <span id="floorsValue" class="value-chip">30</span>
        </div>
        <input id="floorsRange" type="range" min="10" max="30" step="1" value="30" />
      </section>

      <section class="control-group">
        <div class="label-row">
          <label for="durationRange">Total Duration (sec)</label>
          <span id="durationValue" class="value-chip">50s</span>
        </div>
        <input id="durationRange" type="range" min="30" max="70" step="1" value="50" />
      </section>

      <!-- Ball Colors -->
      <section class="control-group grid-two">
        <div class="field color-field">
          <label for="leftColorInput">Left Ball Color</label>
          <div class="color-picker-wrap">
            <input id="leftColorInput" type="color" value="#FFD60A" />
            <span id="leftColorHex">#FFD60A</span>
          </div>
        </div>
        <div class="field color-field">
          <label for="rightColorInput">Right Ball Color</label>
          <div class="color-picker-wrap">
            <input id="rightColorInput" type="color" value="#FF7A00" />
            <span id="rightColorHex">#FF7A00</span>
          </div>
        </div>
      </section>

      <footer class="panel-footer">
        <span>Tip: Change settings &amp; press <strong>Restart</strong> to apply a new race.</span>
      </footer>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
